# ============================================================
#  Application
# ============================================================
spring.application.name=digital-footprint-backend
server.port=8081

# ============================================================
#  PostgreSQL DataSource
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/digital_footprint_db
spring.datasource.username=postgres
spring.datasource.password=sanchita
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP – default in Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
#  JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================================
#  Spring Security
# ============================================================
# Disable the auto-generated password printed on startup
# (replace with your own UserDetailsService / JWT config)
spring.security.user.name=admin
spring.security.user.password=changeme

# ============================================================
#  Validation
# ============================================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ============================================================
#  Logging
# ============================================================
logging.level.root=INFO
logging.level.com.digitalfootprint=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================================
#  CORS (adjust origins to match your Flutter/web frontend)
# ============================================================
# These are read by your CorsConfigurationSource bean
app.cors.allowed-origins=http://localhost:3000,http://localhost:8081
